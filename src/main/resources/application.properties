# Configuracion de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=postgres
spring.datasource.password=8960406
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=create-drop

# Habilitar la creacion del script SQL
spring.jpa.properties.hibernate.hbm2ddl.auto=create
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.scripts-action=create
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.scripts.create-target=classpath:ddl-schema.sql

# Configuracion adicional de Hibernate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Settings
bezkoder.app.jwtSecret=======================BezKoder=Spring===========================
bezkoder.app.jwtExpirationMs=86400000



